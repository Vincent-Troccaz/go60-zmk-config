# ╔═══════════════════════════════════════════════════════════════════════════════╗
# ║                     GO60 Configuration Tracking                               ║
# ║              Comparaison Spécification vs Implémentation                      ║
# ╚═══════════════════════════════════════════════════════════════════════════════╝
#
# Ce fichier remplace GO60-Layers-Map-V10.json
#
# ┌───────────────────────────────────────────────────────────────────────────┐
# │                         DÉFINITION DES STATUTS                            │
# ├─────────────┬─────────────────────────────────────────────────────────────┤
# │ validated   │ Implémenté dans keymap ET testé avec succès sur le clavier  │
# │             │ La touche fonctionne comme prévu dans toutes les conditions │
# ├─────────────┼─────────────────────────────────────────────────────────────┤
# │ implemented │ Implémenté dans keymap mais pas encore testé physiquement   │
# │             │ Le code est présent, en attente de validation sur hardware  │
# ├─────────────┼─────────────────────────────────────────────────────────────┤
# │ pending     │ Non implémenté, reste à coder dans le keymap                │
# │             │ La touche n'existe pas encore ou est vide (&none/&trans)    │
# ├─────────────┼─────────────────────────────────────────────────────────────┤
# │ mismatch    │ Différence entre la spécification (json) et l'implémentation│
# │             │ Le keymap ne correspond pas au comportement attendu         │
# └─────────────┴─────────────────────────────────────────────────────────────┘
#
# Note : Les layers Shift et AltGr sont gérés via mod-morph dans le keymap,
#        pas comme des layers séparés. Ce fichier documente le comportement attendu.

[metadata]
keyboard = "MoErgo GO60"
layout = "Ergo-L"
firmware = "ZMK"
os_layout = "FR-oss"
total_keys = 60
keymap_source = "config/go60.keymap"
last_sync = "2026-01-23"

[summary]
total_layers = 8
keys_validated = 0
keys_implemented = 48
keys_pending = 12
keys_mismatch = 0

